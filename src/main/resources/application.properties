spring.application.name=exemplo
spring.jpa.open-in-view=true

# SQL Server configuration. Set DB_URL, DB_USERNAME and DB_PASSWORD in the environment.
spring.datasource.url=${DB_URL:jdbc:sqlserver://F121-LB2-N17\\SQLEXPRESS:1433;databaseName=bdtestespring;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

# Se você também estiver servindo páginas web, pode querer configurar o filtro de codificação de caracteres
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true